<!DOCTYPE html>
<html class="staticrypt-html" lang="de">
    <head>
        <meta charset="utf-8" />
        <title>Geschützter Bereich</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Cache Control -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --primary-blue: #2563eb;
                --primary-hover: #1d4ed8;
                --bg-gradient-start: #0f172a;
                --bg-gradient-end: #1e3a8a;
                --card-bg: rgba(255, 255, 255, 0.95);
                --text-main: #1e293b;
                --text-muted: #64748b;
                --error-color: #b91c1c;
                --error-bg: #fef2f2;
                --error-border: #fca5a5;
                --border-color: #e2e8f0;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                height: 100%;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            body.staticrypt-body {
                background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-main);
            }

            .staticrypt-spinner-container {
                height: 100vh;
                width: 100vw;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid rgba(255, 255, 255, 0.2);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spinner 0.8s linear infinite;
            }

            @keyframes spinner {
                to { transform: rotate(360deg); }
            }

            .staticrypt-content {
                width: 100%;
                max-width: 420px;
                padding: 20px;
            }

            .staticrypt-card {
                background: var(--card-bg);
                backdrop-filter: blur(10px);
                border-radius: 16px;
                padding: 40px 32px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
                text-align: center;
            }

            .staticrypt-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--text-main);
                margin-bottom: 8px;
            }

            .staticrypt-subtitle {
                font-size: 0.875rem;
                color: var(--text-muted);
                margin-bottom: 24px;
            }

            /* Inline Fehlerbox */
            .staticrypt-error-msg {
                background-color: var(--error-bg);
                color: var(--error-color);
                border: 1px solid var(--error-border);
                padding: 10px 12px;
                border-radius: 8px;
                font-size: 0.875rem;
                margin-bottom: 16px;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .staticrypt-error-msg.hidden {
                display: none !important;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 16px;
            }

            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                width: 100%;
                padding: 12px 42px 12px 14px;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                font-size: 0.95rem;
                outline: none;
                transition: all 0.2s ease;
                background: #ffffff;
            }

            .staticrypt-password-container input:focus {
                border-color: var(--primary-blue);
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }

            /* CSS-basiertes Augen-Symbol statt SVG */
            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                width: 20px;
                height: 14px;
                border: 2px solid var(--text-muted);
                border-radius: 70% / 60%;
                background: transparent;
                padding: 0;
                outline: none;
                transition: border-color 0.2s ease;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-toggle-password-visibility::after {
                content: '';
                width: 6px;
                height: 6px;
                border: 2px solid var(--text-muted);
                border-radius: 50%;
                position: absolute;
            }

            .staticrypt-toggle-password-visibility:hover {
                border-color: var(--primary-blue);
            }
            .staticrypt-toggle-password-visibility:hover::after {
                border-color: var(--primary-blue);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.875rem;
                color: var(--text-muted);
                margin-bottom: 20px;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--primary-blue);
                cursor: pointer;
            }

            .staticrypt-decrypt-button {
                width: 100%;
                padding: 12px;
                background-color: var(--primary-blue);
                color: #ffffff;
                border: none;
                border-radius: 10px;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.1s ease;
            }

            .staticrypt-decrypt-button:hover {
                background-color: var(--primary-hover);
            }

            .staticrypt-decrypt-button:active {
                transform: scale(0.99);
            }

            .staticrypt-footer-links {
                margin-top: 24px;
                padding-top: 16px;
                border-top: 1px solid var(--border-color);
                font-size: 0.8rem;
                color: var(--text-muted);
                display: flex;
                justify-content: center;
                gap: 16px;
            }

            .staticrypt-footer-links a {
                color: var(--text-muted);
                text-decoration: none;
                transition: color 0.2s;
            }

            .staticrypt-footer-links a:hover {
                color: var(--primary-blue);
                text-decoration: underline;
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-card">
                <h1 class="staticrypt-title">Geschützter Bereich</h1>
                <p class="staticrypt-subtitle">Bitte gib deinen Zugangscode ein, um fortzufahren.</p>

                <div id="staticrypt-error" class="staticrypt-error-msg hidden">
                    <span style="font-weight: bold; font-size: 1rem;">!</span>
                    <span id="staticrypt-error-text">Falscher Zugangscode. Bitte versuche es erneut.</span>
                </div>

                <form id="staticrypt-form" action="#" method="post">
                    <div class="staticrypt-password-container">
                        <input
                            id="staticrypt-password"
                            type="password"
                            name="password"
                            placeholder="Zugangscode eingeben"

                    </div>

                    <label id="staticrypt-remember-label" class="staticrypt-remember">
                        <input id="staticrypt-remember" type="checkbox" name="remember" />
                        Angemeldet bleiben
                    </label>

                    <input type="submit" class="staticrypt-decrypt-button" value="Anmelden" />
                </form>

                <div class="staticrypt-footer-links">
                    <a href="https://www.fabiundleon.de/impressum" target="_blank" rel="noopener">Impressum</a>
                    <span>•</span>
                    <a href="https://www.fabiundleon.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
                </div>
            </div>
        </div>

                if (errorEl) {

                        const cleanUrl = url.pathname + (url.search ? url.search : "") + url.hash;
                        window.history.replaceState({}, document.title, cleanUrl);
                    }

                // Wenn der Nutzer tippt, Fehlermeldung wieder ausblenden
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput) {
                    passwordInput.addEventListener("input", function() {
                        hideError();
                    });
                }

                // Formular absenden
                const form = document.getElementById("staticrypt-form");
                if (form) {
                    form.addEventListener("submit", async function (e) {
                        e.preventDefault();
                        hideError();

                        const password = passwordInput ? passwordInput.value : "";
                        const rememberEl = document.getElementById("staticrypt-remember");
                        const isRememberChecked = rememberEl ? rememberEl.checked : false;

                        // Prüfen, ob die StatiCrypt-Variablen vorhanden sind (Datei noch nicht verschlüsselt)
                        if (typeof staticryptConfig === "undefined") {
                            showError("StatiCrypt-Konfiguration fehlt. (Die Datei muss noch mit StatiCrypt verschlüsselt werden)");
                            return;
                        }

                        if (staticrypt && typeof staticrypt.handleDecryptionOfPage === "function") {
                            try {
                                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                                if (isSuccessful) {
                                    removePasswordFromUrl();
                                } else {
                                    showError("Falscher Zugangscode. Bitte versuche es erneut.");
                                }
                            } catch (err) {
                                console.error("Fehler bei der Entschlüsselung:", err);
                                showError("Falscher Zugangscode. Bitte versuche es erneut.");
                            }
                        } else {
                            showError("StatiCrypt Engine konnte nicht geladen werden.");
                        }
                    });
                }
            });
        </script>
    </body>
  </html>
